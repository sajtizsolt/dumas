[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dumas"
version = "0.2.0"
description = "A Discord bot written in Python to bring back memories and create funny conversations."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "discord.py==2.7.1",
    "python-dotenv==1.2.4",
]

[project.scripts]
dumas = "dumas.main:main"

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.1",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # Missing trailing comma (conflicts with formatter)
    "ISC001",  # Implicit string concatenation (conflicts with formatter)
    "D203",    # 1 blank line before class docstring (conflicts with D211)
    "D213",    # Multi-line docstring summary should start at 2nd line (conflicts with D212)
    "EXE002",  # Executable file without shebang (filesystem mount artifact)
    "CPY001",  # Missing copyright header
    "D100",    # Missing docstring in public module
    "D101",    # Missing docstring in public class
    "D102",    # Missing docstring in public method
    "D103",    # Missing docstring in public function
    "D104",    # Missing docstring in public package
    "D107",    # Missing docstring in __init__
    "EM101",   # Exception must not use a string literal
    "EM102",   # Exception must not use an f-string literal
    "TRY003",  # Long message outside exception class
    "S311",    # Standard pseudo-random generators not suitable for cryptography
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",     # Use of assert detected (standard in pytest)
    "S105",     # Possible hardcoded password (test tokens in unit tests)
    "S106",     # Possible hardcoded password argument (test tokens in unit tests)
    "PLR2004",  # Magic value used in comparison
    "TC001",    # Move import into type-checking block
    "TC002",    # Move third-party import into type-checking block
    "TC003",    # Move standard library import into type-checking block
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
